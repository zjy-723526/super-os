DEFAULT Super-OS
PROMPT 0
TIMEOUT 50

LABEL Super-OS
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% intel_iommu=on iommu=pt quiet console=ttyS0,115200 console=tty0
