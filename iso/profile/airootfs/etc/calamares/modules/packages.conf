# Super-OS Package Installation
# These packages are installed in addition to base system
---
backend: pacman

# Operations during install
operations:
  - install:
    - linux-zen
    - linux-zen-headers
    - linux-firmware
    - intel-ucode
    - btrfs-progs
    - sudo
    - vim
    - git
    - curl
    - wget
    - networkmanager
    - efibootmgr

  # GPU drivers (all vendors)
  - install:
    - mesa
    - vulkan-intel
    - vulkan-radeon
    - vulkan-icd-loader
    - vulkan-tools
    - intel-media-driver
    - libva-mesa-driver
    - libva-utils
    - nvidia-dkms
    - nvidia-utils
    - nvidia-settings

  # KDE Plasma 6
  - install:
    - plasma-meta
    - plasma-wayland-session
    - sddm
    - sddm-kcm
    - konsole
    - dolphin
    - kate
    - gwenview
    - okular
    - ark
    - firefox

  # Audio
  - install:
    - pipewire
    - pipewire-pulse
    - pipewire-alsa
    - pipewire-jack
    - wireplumber
    - pavucontrol-qt

  # Virtualization (KVM/QEMU)
  - install:
    - qemu-full
    - libvirt
    - virt-manager
    - edk2-ovmf
    - virglrenderer
    - swtpm
    - spice
    - spice-vdagent
    - virt-viewer

  # Looking Glass build deps
  - install:
    - cmake
    - gcc
    - make
    - wayland
    - wayland-protocols
    - libx11
    - glew
    - glfw-x11
    - freetype2
    - fontconfig
    - sdl2
    - libsamplerate
    - spice-protocol

  # Waydroid + Gaming
  - install:
    - python
    - lxc
    - dnsmasq
    - wine
    - dxvk
    - vkd3d
    - lutris
    - gamemode
    - mangohud
    - steam

  # Fonts
  - install:
    - noto-fonts
    - noto-fonts-cjk
    - noto-fonts-emoji
    - adobe-source-han-sans-cn-fonts
    - adobe-source-han-serif-cn-fonts
    - wqy-microhei
    - wqy-zenhei

  # Chinese Input Method
  - install:
    - fcitx5
    - fcitx5-chinese-addons
    - fcitx5-configtool
    - fcitx5-gtk
    - fcitx5-qt
    - fcitx5-material-color
    - libime
    - fcitx5-pinyin-zhwiki

  # Tools
  - install:
    - firefox
    - htop
    - btop
    - fastfetch
    - usbutils
    - pciutils
