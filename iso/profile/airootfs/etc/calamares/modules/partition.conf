# Super-OS Partition Module
# Btrfs with subvolumes + EFI
---
efi:
    mountPoint: "/boot"
    recommendedSize: 512MiB
    minimumSize: 256MiB

# Default fs type
defaultFileSystemType: "btrfs"

# Available filesystem types in UI
availableFileSystemTypes: ["btrfs","ext4","xfs","f2fs"]

# Show partition actions
showPartitionLabels: true

# Allow manual partitioning
allowManualPartitioning: true

# Erase disk option (default)
initialPartitioningChoice: erase

# Btrfs subvolumes (applied when user chooses erase or replace)
defaultFsOverrides:
    - type: "btrfs"
      subvolumes:
          - name: "@"
            mountPoint: "/"
          - name: "@home"
            mountPoint: "/home"
          - name: "@snapshots"
            mountPoint: "/.snapshots"
          - name: "@var"
            mountPoint: "/var"
      options: "compress=zstd"
