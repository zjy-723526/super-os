# Super-OS Calamares Installer Settings
---
# UI
ui: branded
window-title: "Super-OS Installer"
window-size: 1024px,680px
window-minimum-size: 900px,600px

# Branding
branding: superos

# Welcome message
welcome-style: image
welcome-logo: /usr/share/pixmaps/super-os.png
welcome-text: "<h1>Welcome to Super-OS</h1><p>Windows 11 VM + Android — 全部运行在一个 Linux 上。</p>"

# Locale defaults
locale: zh_CN
locale-global: zh_CN.UTF-8

# Keyboard layout default
keyboard: us

# Modules sequence - determines installer page order
sequence:
  show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksopenswaphookcfg
    - initcpiocfg
    - initcpio
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader
    - packages
    - postinstall
    - umount
  show:
    - finished

# Individual module configurations
modules-search: [ local ]

# Use all available space by default
default-partition-layout: erase

# Enable debugging
debug: false

# Don't prompt for unsupported configurations
disable-cancel: false
disable-cancel-during-exec: false

# Quit-at-end
quit-at-end: false
