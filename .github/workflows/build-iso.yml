name: Build Super-OS ISO

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  # ─── Build Docker image with calamares pre-compiled ───
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push build image
        uses: docker/build-push-action@v6
        with:
          context: iso
          file: iso/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/super-os-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Build ISO using pre-built image ───
  iso:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ISO
        run: |
          mkdir -p iso/output
          docker run --rm --privileged \
            -v "$(pwd):/super-os" \
            -v "$(pwd)/iso/output:/output" \
            ghcr.io/${{ github.repository_owner }}/super-os-builder:latest \
            bash -c '
              set -e
              # Add pre-built calamares repo
              echo "" >> /super-os/iso/profile/pacman.conf
              echo "[superos-repo]" >> /super-os/iso/profile/pacman.conf
              echo "Server = file:///tmp/superos-repo" >> /super-os/iso/profile/pacman.conf
              echo "SigLevel = Never" >> /super-os/iso/profile/pacman.conf
              # Build ISO
              cd /super-os/iso
              bash build-iso.sh /output
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Super-OS-ISO
          path: iso/output/*.iso
          retention-days: 7
          compression-level: 0
